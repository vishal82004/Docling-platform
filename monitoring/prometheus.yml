global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "docling-serve-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["docling-api:5001"]
        labels:
          service: "docling-api"
          tier: "ingestion"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
