<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 820" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="45" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Elastic Document Intelligence Platform</text>
  <text x="50" y="70" font-size="14" font-weight="400" fill="#94a3b8">System Architecture — Left-to-Right Processing, Autoscaling, MLOps Quality Gating &amp; Observability</text>

  <!-- ========================================================================= -->
  <!-- 1. ONLINE PROCESSING PATH (TOP HALF - HORIZONTAL FLOW)                    -->
  <!-- ========================================================================= -->

  <!-- Container Box -->
  <rect x="40" y="95" width="1400" height="280" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="65" y="125" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">ONLINE PROCESSING PIPELINE (ASYNCHRONOUS CONVERSION)</text>

  <!-- Step 1: Clients -->
  <g transform="translate(65, 150)">
    <rect width="170" height="70" rx="10" fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="32" font-size="18">👤</text>
    <text x="50" y="30" font-size="15" font-weight="600" fill="#ffffff">Client</text>
    <text x="50" y="48" font-size="11" fill="#bae6fd">HTTP REST / UI</text>

    <rect y="90" width="170" height="70" rx="10" fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="122" font-size="18">⚡</text>
    <text x="50" y="120" font-size="14" font-weight="600" fill="#ffffff">Batch Generator</text>
    <text x="50" y="138" font-size="11" fill="#bae6fd">Load &amp; Smoke Tests</text>
  </g>

  <!-- Arrow 1: Clients -> Docling API -->
  <path d="M 235 185 L 290 185" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 235 275 L 265 275 L 265 205 L 290 205" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="240" y="172" font-size="10" fill="#94a3b8" font-weight="500">POST async</text>

  <!-- Step 2: Docling Serve API -->
  <g transform="translate(300, 150)">
    <rect width="180" height="160" rx="12" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="38" font-size="22">🌐</text>
    <text x="52" y="35" font-size="16" font-weight="700" fill="#ffffff">Docling API</text>
    <text x="52" y="52" font-size="12" fill="#a7f3d0">FastAPI Engine</text>

    <!-- Sub-boxes -->
    <rect x="15" y="75" width="150" height="32" rx="6" fill="#042f2e" stroke="#059669" stroke-width="1"/>
    <text x="25" y="95" font-size="12" fill="#6ee7b7">📄 OpenAPI (/docs)</text>

    <rect x="15" y="115" width="150" height="32" rx="6" fill="#042f2e" stroke="#059669" stroke-width="1"/>
    <text x="25" y="135" font-size="12" fill="#6ee7b7">🔄 /v1/status/poll</text>
  </g>

  <!-- Arrow 2: API -> Redis -->
  <path d="M 480 230 L 535 230" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="488" y="220" font-size="11" fill="#6ee7b7" font-weight="600">Enqueue</text>

  <!-- Step 3: Redis + RQ Queue -->
  <g transform="translate(545, 150)">
    <rect width="170" height="160" rx="12" fill="url(#redGrad)" stroke="#f87171" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="38" font-size="22">📦</text>
    <text x="52" y="35" font-size="16" font-weight="700" fill="#ffffff">Redis + RQ</text>
    <text x="52" y="52" font-size="12" fill="#fecaca">Message Broker</text>

    <rect x="15" y="75" width="140" height="32" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="25" y="95" font-size="11" fill="#fca5a5">📋 rq:queue:convert</text>

    <rect x="15" y="115" width="140" height="32" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="25" y="135" font-size="11" fill="#fca5a5">💾 Job Metadata</text>
  </g>

  <!-- Arrow 3: Redis -> Workers -->
  <path d="M 715 230 L 765 230" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="720" y="220" font-size="11" fill="#fca5a5" font-weight="600">Dequeue</text>

  <!-- Step 4: Docling Workers -->
  <g transform="translate(775, 140)">
    <rect width="190" height="180" rx="12" fill="url(#orangeGrad)" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="22">⚙️</text>
    <text x="52" y="33" font-size="16" font-weight="700" fill="#ffffff">RQ Workers</text>
    <text x="52" y="50" font-size="12" fill="#fed7aa">Docling Engine (CPU)</text>

    <rect x="15" y="65" width="160" height="30" rx="6" fill="#431407" stroke="#ea580c" stroke-width="1"/>
    <text x="25" y="84" font-size="12" fill="#fdba74">⚙️ Worker 1 (Active)</text>

    <rect x="15" y="102" width="160" height="30" rx="6" fill="#431407" stroke="#ea580c" stroke-width="1"/>
    <text x="25" y="121" font-size="12" fill="#fdba74">⚙️ Worker 2 (Active)</text>

    <rect x="15" y="138" width="160" height="30" rx="6" fill="#431407" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="25" y="157" font-size="12" fill="#fed7aa">⚙️ Worker N (KEDA)</text>
  </g>

  <!-- Arrow 4: Workers -> Converted Output -->
  <path d="M 965 230 L 1015 230" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="968" y="220" font-size="11" fill="#fdba74" font-weight="600">Outputs</text>

  <!-- Step 5: Converted Output -->
  <g transform="translate(1025, 150)">
    <rect width="180" height="160" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="38" font-size="22">📑</text>
    <text x="52" y="35" font-size="16" font-weight="700" fill="#ffffff">Document</text>
    <text x="52" y="52" font-size="12" fill="#94a3b8">Converted Output</text>

    <rect x="15" y="75" width="150" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="95" font-size="12" fill="#cbd5e1">📝 Markdown (.md)</text>

    <rect x="15" y="115" width="150" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="135" font-size="12" fill="#cbd5e1">📦 Docling JSON</text>
  </g>

  <!-- Arrow 5: Converted Output -> Optional LLM -->
  <path d="M 1205 230 L 1245 230" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Step 6: Optional Pretrained LLM -->
  <g transform="translate(1255, 150)">
    <rect width="165" height="160" rx="12" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="38" font-size="22">🧠</text>
    <text x="48" y="35" font-size="15" font-weight="700" fill="#ffffff">Optional LLM</text>
    <text x="48" y="52" font-size="11" fill="#e9d5ff">Field Extraction</text>

    <rect x="12" y="75" width="140" height="32" rx="6" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
    <text x="20" y="95" font-size="11" fill="#d8b4fe">🔍 Field Mapping</text>

    <rect x="12" y="115" width="140" height="32" rx="6" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
    <text x="20" y="135" font-size="11" fill="#d8b4fe">📊 Structured JSON</text>
  </g>

  <!-- Return Flow /v1/result dotted line back to API -->
  <path d="M 1115 310 L 1115 340 L 390 340 L 390 310" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
  <text x="730" y="355" font-size="11" fill="#94a3b8" text-anchor="middle">GET /v1/result/{task_id} (Client Fetches Completed Content)</text>

  <!-- ========================================================================= -->
  <!-- 2. PLATFORM & AUTOSCALING (BOTTOM LEFT - HORIZONTAL)                     -->
  <!-- ========================================================================= -->

  <rect x="40" y="405" width="560" height="385" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="65" y="435" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="1">PLATFORM INFRASTRUCTURE &amp; AUTOSCALING (AKS &amp; KEDA)</text>

  <!-- Terraform -->
  <g transform="translate(65, 460)">
    <rect width="130" height="70" rx="10" fill="url(#purpleGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="15" y="33" font-size="18">🏗️</text>
    <text x="42" y="32" font-size="15" font-weight="700" fill="#ffffff">Terraform</text>
    <text x="42" y="50" font-size="11" fill="#e9d5ff">IaC Modules</text>
  </g>

  <path d="M 195 495 L 235 495" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="200" y="488" font-size="10" fill="#c4b5fd">Provisions</text>

  <!-- Azure AKS Cluster -->
  <g transform="translate(245, 460)">
    <rect width="330" height="205" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="18">☸️</text>
    <text x="45" y="30" font-size="15" font-weight="700" fill="#38bdf8">Azure AKS Cluster</text>

    <!-- Deployments inside AKS -->
    <rect x="15" y="50" width="140" height="32" rx="6" fill="#1e293b" stroke="#0369a1" stroke-width="1"/>
    <text x="23" y="70" font-size="11" fill="#bae6fd">🌐 API Deployment</text>

    <rect x="175" y="50" width="140" height="32" rx="6" fill="#1e293b" stroke="#0369a1" stroke-width="1"/>
    <text x="183" y="70" font-size="11" fill="#bae6fd">📦 Redis Deployment</text>

    <rect x="15" y="90" width="140" height="32" rx="6" fill="#1e293b" stroke="#0369a1" stroke-width="1"/>
    <text x="23" y="110" font-size="11" fill="#bae6fd">⚙️ Worker Deployment</text>

    <rect x="175" y="90" width="140" height="32" rx="6" fill="#1e293b" stroke="#0369a1" stroke-width="1"/>
    <text x="183" y="110" font-size="11" fill="#bae6fd">🧠 Model Service (Opt)</text>

    <!-- AKS Autoscaler -->
    <rect x="15" y="135" width="300" height="55" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="157" font-size="13" font-weight="600" fill="#ffffff">📊 AKS Cluster Autoscaler</text>
    <text x="25" y="175" font-size="11" fill="#bae6fd">Dynamically adjusts VM node count based on pod demand</text>
  </g>

  <!-- KEDA Scaler Box -->
  <g transform="translate(65, 680)">
    <rect width="510" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="33" font-size="20">📈</text>
    <text x="50" y="32" font-size="15" font-weight="700" fill="#ffffff">KEDA Scaler (Redis Lists Scaler)</text>
    <text x="50" y="52" font-size="12" fill="#a7f3d0">Monitors queue length (rq:queue:convert) → Scales worker pods 0..N</text>
    <text x="50" y="70" font-size="11" fill="#6ee7b7">Zero-scale idle saving | Event-driven replica scaling</text>
  </g>

  <!-- KEDA Connection line up to Redis and Workers -->
  <path d="M 625 310 L 625 725 L 575 725" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
  <text x="635" y="660" font-size="10" fill="#34d399">Queue backlog metric</text>

  <!-- ========================================================================= -->
  <!-- 3. MLOPS & QUALITY GATE (BOTTOM MIDDLE)                                   -->
  <!-- ========================================================================= -->

  <rect x="625" y="405" width="400" height="385" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="650" y="435" font-size="13" font-weight="700" fill="#c084fc" letter-spacing="1">MLOPS &amp; RELEASE QUALITY GATES</text>

  <!-- Evaluation Harness -->
  <g transform="translate(650, 460)">
    <rect width="350" height="100" rx="10" fill="url(#slateGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="18">🧪</text>
    <text x="45" y="30" font-size="15" font-weight="700" fill="#ffffff">Evaluation Harness (evaluate.py)</text>
    <text x="45" y="48" font-size="11" fill="#c4b5fd">Evaluates document conversion + LLM field extraction</text>

    <rect x="15" y="60" width="150" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="23" y="78" font-size="11" fill="#a5b4fc">📂 invoice-eval-v1</text>

    <rect x="175" y="60" width="160" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="183" y="78" font-size="11" fill="#a5b4fc">📋 ground_truth.jsonl</text>
  </g>

  <!-- MLflow -->
  <g transform="translate(650, 580)">
    <rect width="350" height="85" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="20">📊</text>
    <text x="48" y="30" font-size="15" font-weight="700" fill="#ffffff">MLflow Tracking</text>
    <text x="48" y="48" font-size="11" fill="#e9d5ff">Logs parameters, metrics, p50/p95 latency, reports</text>
    <text x="48" y="68" font-size="11" fill="#d8b4fe">Compares candidate models / prompts side-by-side</text>
  </g>

  <!-- GitHub Actions Quality Gate -->
  <g transform="translate(650, 685)">
    <rect width="350" height="85" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="20">🛡️</text>
    <text x="48" y="30" font-size="15" font-weight="700" fill="#ffffff">GitHub Actions Quality Gate</text>
    <text x="48" y="48" font-size="11" fill="#c7d2fe">Runs tests on PR/push: min accuracy &amp; max latency</text>
    <text x="48" y="68" font-size="11" fill="#818cf8">Pass / Fail gating: blocks regressions from deployment</text>
  </g>

  <path d="M 825 560 L 825 580" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 825 665 L 825 685" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ========================================================================= -->
  <!-- 4. OBSERVABILITY & TELEMETRY (BOTTOM RIGHT)                               -->
  <!-- ========================================================================= -->

  <rect x="1050" y="405" width="390" height="385" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1075" y="435" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1">OBSERVABILITY &amp; TELEMETRY</text>

  <!-- Prometheus -->
  <g transform="translate(1075, 460)">
    <rect width="340" height="90" rx="10" fill="url(#orangeGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="20">🔥</text>
    <text x="48" y="30" font-size="15" font-weight="700" fill="#ffffff">Prometheus Server</text>
    <text x="48" y="50" font-size="11" fill="#fef3c7">Scrapes metrics from API, Redis queue, and workers</text>
    <text x="48" y="70" font-size="11" fill="#fde68a">Tracks queue depth, job rate, errors, memory/CPU</text>
  </g>

  <!-- Grafana -->
  <g transform="translate(1075, 570)">
    <rect width="340" height="105" rx="10" fill="#451a03" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="20">📈</text>
    <text x="48" y="30" font-size="15" font-weight="700" fill="#ffffff">Grafana Dashboards</text>

    <rect x="20" y="45" width="140" height="24" rx="4" fill="#78350f"/>
    <text x="28" y="61" font-size="10" fill="#fde68a">📊 Queue Backlog</text>

    <rect x="175" y="45" width="145" height="24" rx="4" fill="#78350f"/>
    <text x="183" y="61" font-size="10" fill="#fde68a">⚡ Latency (p50/p95)</text>

    <rect x="20" y="75" width="140" height="24" rx="4" fill="#78350f"/>
    <text x="28" y="91" font-size="10" fill="#fde68a">❌ Error Rates &amp; SLOs</text>

    <rect x="175" y="75" width="145" height="24" rx="4" fill="#78350f"/>
    <text x="183" y="91" font-size="10" fill="#fde68a">💻 Worker Replicas</text>
  </g>

  <!-- OpenTelemetry -->
  <g transform="translate(1075, 695)">
    <rect width="340" height="75" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="32" font-size="20">🔍</text>
    <text x="48" y="30" font-size="15" font-weight="700" fill="#ffffff">OpenTelemetry (OTel)</text>
    <text x="48" y="48" font-size="11" fill="#bae6fd">Distributed request tracing across components</text>
    <text x="48" y="65" font-size="11" fill="#7dd3fc">Spans: Client → API → Redis Queue → Worker → Store</text>
  </g>

  <path d="M 1245 550 L 1245 570" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 1245 675 L 1245 695" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

</svg>

