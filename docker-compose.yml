services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  docling-api:
    image: quay.io/docling-project/docling-serve
    entrypoint: ["docling-serve"]
    command: ["run"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_SERVE_ENG_KIND: "rq"
      DOCLING_SERVE_ENG_RQ_REDIS_URL: "redis://redis:6379/0"
      DOCLING_SERVE_ENG_RQ_QUEUE_NAME: "convert"
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  docling-worker:
    image: quay.io/docling-project/docling-serve
    entrypoint: ["docling-serve"]
    command: ["rq-worker"]
    environment:
      DOCLING_SERVE_ENG_KIND: "rq"
      DOCLING_SERVE_ENG_RQ_REDIS_URL: "redis://redis:6379/0"
      DOCLING_SERVE_ENG_RQ_QUEUE_NAME: "convert"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////data/mlflow.db", "--default-artifact-root", "/data/artifacts"]
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  mlflow-data:
