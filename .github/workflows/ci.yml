name: CI / CD Quality Gate & Repository Hygiene

on:
  push:
    branches: [main, master, "releases/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Linting & Formatting Standards
  # =========================================================================
  lint-and-format:
    name: Code Quality (Ruff Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linter
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  # =========================================================================
  # 2. Fast Isolated Unit Tests
  # =========================================================================
  unit-tests:
    name: Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: pytest tests/unit -v --junitxml=reports/unit-test-results.xml

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit-test-results.xml
          retention-days: 14

  # =========================================================================
  # 3. Docker Compose Specification Validation
  # =========================================================================
  compose-validation:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Compose File Integrity
        run: docker compose config

  # =========================================================================
  # 4. MLOps Quality Gate (Evaluation & Regression Gating)
  # =========================================================================
  mlops-quality-gate:
    name: MLOps Quality Gate (invoice-eval-v1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Baseline Quality Gate
        run: |
          python evaluation/evaluate.py \
            --candidate baseline \
            --min-field-acc 0.85 \
            --min-schema-valid 0.95 \
            --min-exact-match 0.75 \
            --max-failure-rate 0.05 \
            --max-p95-latency 5.0

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-eval-reports
          path: evaluation/reports/
          retention-days: 14

  # =========================================================================
  # 5. Infrastructure Code Validation (Terraform)
  # =========================================================================
  terraform-checks:
    name: Terraform Format & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform Format & Validate
        run: |
          if [ -d "infra/terraform" ] && [ "$(ls -A infra/terraform/*.tf 2>/dev/null)" ]; then
            cd infra/terraform
            terraform fmt -check
            terraform init -backend=false
            terraform validate
          else
            echo "No terraform files in infra/terraform yet (scheduled for Phase 6)."
          fi

