apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-api
  namespace: docling-platform
  labels:
    app.kubernetes.io/name: docling-api
    app.kubernetes.io/component: ingestion-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docling-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docling-api
        app.kubernetes.io/component: ingestion-api
    spec:
      containers:
        - name: docling-api
          image: quay.io/docling-project/docling-serve:latest
          imagePullPolicy: IfNotPresent
          command: ["docling-serve", "run"]
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: docling-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: docling-api
  namespace: docling-platform
  labels:
    app.kubernetes.io/name: docling-api
    app.kubernetes.io/component: ingestion-api
spec:
  type: LoadBalancer
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: docling-api

